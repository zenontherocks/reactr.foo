name = "reactr-foo"
main = "src/worker.ts"
compatibility_date = "2024-09-23"

routes = [
  { pattern = "reactr.foo/*", zone_name = "reactr.foo" }
]

[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "reactr-foo"
database_id = "debbffbe-0fae-4cdc-aee5-67e8c39ff823"
migrations_dir = "migrations"

[triggers]
# The haunting now only harvests reaction counts (never note content, which
# the client fetches live from relays on demand) and prunes via an indexed
# query, so its per-tick cost is small and roughly flat regardless of table
# size. Hourly instead of every 5 minutes is a 12x cut in run count, keeping
# writes/day (relays x SOULS_PER_RELAY x 2) comfortably under D1's free-tier
# write cap even as the relay list grows.
crons = ["0 * * * *"]
