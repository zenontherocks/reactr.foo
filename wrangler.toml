name = "reactr-foo"
main = "src/worker.ts"
compatibility_date = "2024-09-23"

routes = [
  { pattern = "reactr.foo/*", zone_name = "reactr.foo" }
]

[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "reactr-foo"
database_id = "debbffbe-0fae-4cdc-aee5-67e8c39ff823"
migrations_dir = "migrations"

[triggers]
# The haunting is paused: with no real traffic, this background crawl (every
# 5 minutes, scanning the full nostr_events/reaction_notes tables each time)
# was the entire source of ~7M D1 reads/day. Re-enable with
# crons = ["*/5 * * * *"] once there's real usage to justify backfilling.
crons = []
